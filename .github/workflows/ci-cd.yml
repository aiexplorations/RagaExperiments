# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Build backend
      run: sbt compile

    - name: Build frontend
      run: |
        cd raga-experiments-frontend
        npm install
        npm run build

    - name: Deploy
      run: echo "Deploy step here"